<!DOCTYPE html>
<!--
  Quackling browser PoC.

  Browser -> WASM -> fetch() -> DuckDB Quack server -> DataChunk -> JS.

  Serve this directory over HTTP (WASM cannot be loaded from file://):

    zig build wasm            # writes web/quackling.wasm
    cp web/quackling.wasm examples/browser/
    python3 -m http.server 8080 --directory .
    # then open http://localhost:8080/examples/browser/

  And run a Quack server that allows this origin:

    duckdb -c "LOAD quack; CALL quack_serve('quack:localhost:9494', token => 'super_secret');"

  The server already sends Access-Control-Allow-Origin: *.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Quackling - DuckDB Quack client in WASM</title>
  <!-- Inline data: URI, so the browser stops probing /favicon.ico. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='13' font-size='13'%3E%F0%9F%A6%86%3C/text%3E%3C/svg%3E">
  <style>
    body { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
           max-width: 60rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
    h1 { font-size: 1.25rem; }
    label { display: block; margin-top: .75rem; font-size: .85rem; color: #555; }
    input, textarea { width: 100%; font-family: inherit; font-size: .9rem;
                      padding: .4rem; border: 1px solid #ccc; border-radius: 4px; }
    textarea { height: 5rem; }
    button { margin-top: .75rem; padding: .5rem 1rem; font-family: inherit; cursor: pointer; }
    table { border-collapse: collapse; margin-top: 1rem; font-size: .9rem; }
    th, td { border: 1px solid #ddd; padding: .3rem .6rem; text-align: left; }
    th { background: #f5f5f5; }
    .null { color: #999; font-style: italic; }
    #status { margin-top: 1rem; font-size: .85rem; }
    .err { color: #b00; white-space: pre-wrap; }
    .ok { color: #060; }
  </style>
</head>
<body>
  <h1>Quackling — DuckDB over Quack, decoded in WebAssembly</h1>
  <p style="font-size:.85rem;color:#555">
    The Quack wire protocol is parsed by Zig compiled to WASM. JavaScript only
    calls <code>fetch()</code> and reads decoded columns out of linear memory.
  </p>

  <label>Server <input id="url" value="quack:localhost:9494"></label>
  <label>Token <input id="token" value="super_secret" type="password"></label>
  <label>SQL <textarea id="sql">SELECT 42 AS answer</textarea></label>
  <div id="samples"></div>
  <button id="run">Run query</button>
  <label style="display:inline-flex;gap:.4rem;align-items:center;margin-top:.5rem">
    <input type="checkbox" id="vectorized"> use vectorized (TypedArray) path
  </label>

  <div id="status"></div>
  <div id="out"></div>

  <script type="module">
    import { Quack } from '../../web/quack.js';

    const $ = (id) => document.getElementById(id);
    const status = $('status');
    let db = null;
    let connectedTo = null;

    // Sample queries, chosen to show off the parts that are easy to get wrong.
    const SAMPLES = [
      ['SELECT 42', 'SELECT 42 AS answer'],
      ['types', `SELECT 1::TINYINT a, 2.5::DOUBLE b, 'hi' c, true d,
       NULL::INTEGER e, DATE '2024-03-15' f,
       9223372036854775807::BIGINT big`],
      ['unicode', "SELECT 'wörld🦆' AS greeting"],
      ['enum / uuid', `SELECT 'happy'::ENUM('sad','ok','happy') mood,
       gen_random_uuid() id`],
      ['1M rows (streams via FETCH)', 'SELECT i, i*2 AS doubled FROM range(1000000) t(i)'],
      ['aggregate', `SELECT i % 10 AS bucket, count(*) n, sum(i) total
  FROM range(100000) t(i) GROUP BY 1 ORDER BY 1`],
      ['nested (expected error)', "SELECT {'a': 1, 'b': 'x'} AS s"],
      ['SQL error', 'SELECT * FROM no_such_table'],
    ];
    for (const [label, sql] of SAMPLES) {
      const b = document.createElement('button');
      b.textContent = label;
      b.style.cssText = 'margin:.25rem .25rem 0 0;padding:.2rem .5rem;font-size:.75rem';
      b.addEventListener('click', () => { $('sql').value = sql; run(); });
      $('samples').appendChild(b);
    }

    async function run() {
      const url = $('url').value.trim();
      const token = $('token').value;
      const sql = $('sql').value.trim();
      status.className = '';
      status.textContent = 'connecting…';
      $('out').innerHTML = '';

      try {
        // Reconnect only when the endpoint changed.
        if (!db || connectedTo !== url + token) {
          db = await Quack.connect({ wasm: './quackling.wasm', url, token });
          connectedTo = url + token;
        }
        status.textContent = 'running…';
        const t0 = performance.now();
        const result = await db.query(sql);

        // Streams via FETCH, so a large result is not silently truncated. The
        // whole result is counted; only the first rows are kept for the table.
        const rows = [];
        let total = 0, chunks = 0, fastPath = 0;
        const vectorized = $('vectorized').checked;

        for await (const chunk of result.chunks()) {
          chunks++;
          total += chunk.rowCount;
          if (vectorized && chunk.array(0)) fastPath++;
          // Keep a bounded sample for display; the rest is still streamed.
          if (rows.length < 200) {
            for (const row of chunk.rows()) {
              rows.push(row);
              if (rows.length >= 200) break;
            }
          }
        }
        const ms = (performance.now() - t0).toFixed(1);

        status.className = 'ok';
        status.textContent =
          `${total.toLocaleString()} row(s) in ${chunks} chunk(s), ${ms} ms` +
          (vectorized ? ` · ${fastPath}/${chunks} chunks used the TypedArray path` : '') +
          (total > rows.length ? ` · showing first ${rows.length}` : '');
        render(result, rows);
      } catch (e) {
        status.className = 'err';
        status.textContent = String(e.message ?? e);
      }
    }

    function render(result, rows) {
      const table = document.createElement('table');
      const thead = table.createTHead().insertRow();
      for (const c of result.columns) {
        const th = document.createElement('th');
        th.textContent = c.name;
        thead.appendChild(th);
      }
      const tbody = table.createTBody();
      for (const row of rows) {
        const tr = tbody.insertRow();
        for (const c of result.columns) {
          const td = tr.insertCell();
          const v = row[c.name];
          if (v === null) { td.textContent = 'NULL'; td.className = 'null'; }
          else if (v instanceof Uint8Array) td.textContent = `<${v.length} bytes>`;
          else td.textContent = String(v);
        }
      }
      $('out').appendChild(table);
    }

    $('run').addEventListener('click', run);
    $('sql').addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') run();
    });
  </script>
</body>
</html>
