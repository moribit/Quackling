name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  ZIG_VERSION: 0.16.0

jobs:
  # Unit + golden + fuzz tests. These need no server, so they run everywhere.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build test --summary all
      - run: zig fmt --check src tests examples bench build.zig

  # The protocol core must compile everywhere, including both wasm flavours.
  cross-compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-gnu
          - aarch64-linux-gnu
          - x86_64-macos
          - aarch64-macos
          - x86_64-windows-gnu
          - wasm32-wasi
          - wasm32-freestanding
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      # `check` builds the library alone: the CLI needs sockets, the library
      # does not.
      - run: zig build check -Dtarget=${{ matrix.target }}

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build wasm
      - run: ls -la zig-out/bin/quackling.wasm
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Exercises the JS-facing FFI boundary with hostile arguments.
      - run: zig build test-wasm

  # Protocol compatibility against a real DuckDB. This is the job that catches
  # an upstream wire-format change (todo.md §24).
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        duckdb: ["1.4.1", "latest"]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install DuckDB
        run: |
          if [ "${{ matrix.duckdb }}" = "latest" ]; then
            URL=$(curl -s https://api.github.com/repos/duckdb/duckdb/releases/latest \
              | grep -o 'https://[^"]*duckdb_cli-linux-amd64.zip' | head -1)
          else
            URL="https://github.com/duckdb/duckdb/releases/download/v${{ matrix.duckdb }}/duckdb_cli-linux-amd64.zip"
          fi
          curl -sL "$URL" -o duckdb.zip && unzip -o duckdb.zip && chmod +x duckdb
      - name: Start Quack server
        run: |
          mkfifo qpipe
          (sleep 300 > qpipe &)
          ./duckdb < qpipe > server.log 2>&1 &
          sleep 2
          printf "INSTALL quack;\nLOAD quack;\nCALL quack_serve('quack:localhost:9494', token => 'ci_token');\n" > qpipe
          for i in $(seq 1 30); do
            curl -sf http://localhost:9494/ >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:9494/ || { cat server.log; exit 1; }
      - run: zig build test-integration -Dquack-token=ci_token --summary all
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # The JS binding's own tests need the same live server.
      - run: zig build wasm
      - run: QUACK_TEST_TOKEN=ci_token node --test web/test/binding.test.mjs
      - if: failure()
        run: cat server.log

  # Mutation testing: proves the suite would actually notice if a safety guard
  # were removed. Slow (one full test run per mutant), so it is its own job.
  mutation:
    runs-on: ubuntu-latest
    # Runs the whole suite once per mutant. A couple of mutants are caught only
    # by hanging, so the job needs headroom - but not unbounded headroom.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: python3 -u scripts/mutation_test.py

  # The install scripts are the first thing a new user runs, so they get linted
  # and exercised rather than trusted.
  installers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: shellcheck (POSIX sh)
        run: shellcheck -s sh scripts/install.sh scripts/checksums.sh
      - name: PowerShell parse check
        shell: pwsh
        run: |
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/scripts/install.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | ForEach-Object { $_.Message }; exit 1 }
      - name: install.sh --dry-run
        run: sh scripts/install.sh --dry-run --version v0.0.1
      - name: install.sh --build (real install, then run it)
        run: |
          sh scripts/install.sh --build --bin-dir "$HOME/.local/bin"
          "$HOME/.local/bin/quackling" --version
          # The qkl alias must exist, point at our binary, and report the
          # canonical name - installers and scripts parse that string.
          test -L "$HOME/.local/bin/qkl"
          "$HOME/.local/bin/qkl" --version | grep -q '^quackling '
      - name: install.sh --no-alias (must install only the canonical name)
        run: |
          sh scripts/install.sh --build --bin-dir "$HOME/.no-alias-bin" --no-alias
          test -x "$HOME/.no-alias-bin/quackling"
          test ! -e "$HOME/.no-alias-bin/qkl"
      - name: release artifacts and matching checksums
        run: |
          zig build release -Dversion=ci-test
          ls -la zig-out/release/
          # A SHA256SUMS that does not match its binaries would make the
          # installer reject a good download, so verify it here.
          cd zig-out/release && sha256sum -c SHA256SUMS

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build bench
